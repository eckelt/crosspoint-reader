name: Deskleaf X4 Pro firmware

# Fork-only: builds the X4 Pro firmware with the Deskleaf calendar and keeps
# firmware.bin as a run artifact (flash via crosspointreader.com -> Custom .bin).
# Pushes to deskleaf-calendar also publish a GitHub release; the device's
# Wi-Fi update (OtaUpdater) reads this fork's latest release.
on:
  push:
    branches: ['deskleaf-*']
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.2
          path: .hostdeps/ArduinoJson
      - name: Calendar host tests
        run: ARDUINOJSON_SRC=.hostdeps/ArduinoJson/src ./test/deskleaf_calendar/run.sh

  firmware:
    runs-on: ubuntu-latest
    needs: host-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-x4pro-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v3-${{ runner.os }}-x4pro-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e x4pro
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Set release version
        id: version
        # <upstream major.minor>.<run number>: grows with every build, so the
        # device's semantic version check sees each release as newer.
        run: |
          set -euo pipefail
          base=$(sed -n 's/^version = \([0-9]*\.[0-9]*\)\.[0-9]*$/\1/p' platformio.ini | head -1)
          test -n "$base"
          version="$base.${{ github.run_number }}"
          sed -i "s/^version = [0-9.]*$/version = $version/" platformio.ini
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Build x4pro firmware
        run: |
          set -euo pipefail
          pio run -e x4pro | tee pio.log
          grep -E "RAM:|Flash:" pio.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-x4pro-deskleaf
          # The ELF decodes the backtrace in a device's /crash_report.txt.
          path: |
            .pio/build/x4pro/firmware.bin
            .pio/build/x4pro/firmware.elf
          retention-days: 90
          if-no-files-found: error

      - name: Publish release for Wi-Fi update
        if: github.ref == 'refs/heads/deskleaf-calendar'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="crosspoint-$VERSION-x4pro.bin"
          cp .pio/build/x4pro/firmware.bin "$asset"
          gh release create "$VERSION" "$asset" --target "$GITHUB_SHA" --latest \
            --title "Deskleaf $VERSION" --notes "X4 Pro firmware with the Deskleaf calendar ($GITHUB_SHA)."
